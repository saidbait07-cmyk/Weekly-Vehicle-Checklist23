# Full application: Node.js + managed PostgreSQL + persistent photo storage.
# Paid resources: review Render's current prices before approving deployment.
services:
  - type: web
    name: svifms
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: svifms-photos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: svifms-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SEED_ADMIN_ID
        value: ADMIN001
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: 'false'
databases:
  - name: svifms-db
    region: frankfurt
    plan: basic-256mb
    databaseName: svifms
    user: svifms
    ipAllowList: []
